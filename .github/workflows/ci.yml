# CI on every pull request, and CI + deploy on every push to main.
#
# One workflow rather than two so the deploy job can `needs:` the check job: the
# commit that reaches the server is exactly the commit that passed, with no
# cross-workflow trigger to reason about.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes the run before it. On main nothing is ever
# cancelled — a deploy interrupted halfway is worse than a deploy that waits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether anything that can affect the gate, the image, or the deploy
  # changed. A README or docs/ edit cannot: Prettier ignores *.md, nothing under
  # src/ reads docs/, and neither is copied into the image — so such a change
  # skips the install, the services, the suite, the build, and the deploy.
  #
  # A job-level skip rather than a workflow-level `paths-ignore` on purpose: a
  # skipped JOB reports as passed, so `check` can be a required status on main. A
  # workflow that never starts reports nothing, and a required check would leave a
  # docs-only pull request waiting on it for ever.
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      verified: ${{ steps.verified.outputs.hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a push can carry any number of commits, and the diff
          # below needs the commit main pointed at before it.
          fetch-depth: 0

      - id: diff
        env:
          # A pull request is checked out as its merge commit, whose first parent
          # is the base branch — so HEAD^1..HEAD is exactly what the PR changes.
          # A push is compared with where the branch was before it.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # Fail safe: if the base cannot be resolved (a force-push, a brand-new
          # branch), assume code changed and run everything.
          if ! changed=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then
            echo "cannot diff against '$BASE' — treating as a code change"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A deny-list, not an allow-list: a kind of file nobody thought about
          # is treated as code. Only what provably cannot matter is exempt.
          code=$(printf '%s\n' "$changed" | grep -Ev '(\.md$|^docs/|^LICENSE$)' || true)

          if [ -n "$code" ]; then
            printf 'code changed — running the full gate:\n%s\n' "$code"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            printf 'documentation only — skipping the gate and the deploy:\n%s\n' "$changed"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # A push to main whose tree a pull-request run already verified needs no
      # second gate: the PR run tested `refs/pull/N/merge`, and when main has not
      # moved since, the merge commit has the identical tree. The PR run leaves a
      # marker artifact named after that tree (see the end of `check`); found
      # here, the gate is skipped and the deploy proceeds on the PR's result. A
      # tree that differs — main moved, a squash that changed something — has no
      # marker and runs the gate as before. The lookup failing (API hiccup) also
      # means "not verified": the only fallback is to run the gate.
      - id: verified
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-tree-$tree&per_page=1" \
                    --jq '[.artifacts[] | select(.expired == false)] | length' 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "tree $tree was verified by a pull-request run — skipping the gate"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "tree $tree has no verified marker — running the gate"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: typecheck · lint · format · test
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To leave the verified-tree marker below.
      actions: write

    # The suite runs against a real Postgres and Redis (see CLAUDE.md): the
    # guarantees under test — unique constraints, upserts, queue coalescing —
    # live in them. Same images as docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lidor
          POSTGRES_PASSWORD: lidor_ci_password
          POSTGRES_DB: lidor_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lidor -d lidor_bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # All the suite needs. It derives its own `lidor_bot_test` database from
      # this URL and creates it, so development data is never what it truncates.
      DATABASE_URL: postgresql://lidor:lidor_ci_password@localhost:5432/lidor_bot
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same gate as the local pre-commit: typecheck + lint + format + test.
      - run: npm run check

      # `check` typechecks with tsconfig.json; the image is built with
      # tsconfig.build.json. Compile with that too, so a build-only break is
      # caught here rather than by the server halfway through a deploy.
      - run: npm run build

      # Leave the marker a later push to main looks for (see `changes`). Named
      # after the TREE that was tested — the merge of this PR into main as it is
      # now — so it matches the merge commit only if nothing else has changed.
      # Reached only when every step above passed, so its existence is the proof.
      - id: tree
        if: github.event_name == 'pull_request'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "sha=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > verified-tree.txt
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: verified-tree-${{ steps.tree.outputs.sha }}
          path: verified-tree.txt
          retention-days: 7

  deploy:
    name: deploy to production
    needs: [changes, check]
    # `!cancelled()` because `check` may have been SKIPPED on purpose (the PR
    # run already verified this tree) and a skipped dependency would otherwise
    # skip this job too. The condition then requires either a passing gate or a
    # verified tree — never neither.
    #
    # Nothing to ship when only documentation changed — the image would be
    # byte-for-byte the same. The server picks those commits up on the next real
    # deploy, which fast-forwards past them.
    #
    # DEPLOY_ENABLED is a repository *variable*: the switch that turns CD on once
    # the secrets exist, and the way to pause it (before a rollback, say)
    # without touching this file.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      (needs.check.result == 'success' ||
       (needs.check.result == 'skipped' && needs.changes.outputs.verified == 'true')) &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Plain ssh rather than a marketplace action: this step holds the key to
      # production, so it runs no third-party code.
      #
      # The key is pinned on the server to deploy/remote-deploy.sh (a forced
      # command), which takes the commit sha as its only input. It cannot open a
      # shell, so a leaked secret can deploy main and do nothing else.
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's host key is pinned, not trusted on first use: a runner
          # is a fresh machine every time, so "first use" would be every use.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

      # From outside, through Caddy and real TLS — the path Meta's webhooks take.
      # /health also pings the database, so this fails if the new app cannot
      # reach it.
      - name: Verify /health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$DEPLOY_HOST/health"
